apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: agent-invest
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.1.0
          args:
            - mlflow
            - server
            - --backend-store-uri
            - sqlite:///mlflow/mlflow.db
            - --default-artifact-root
            - /mlflow/artifacts
            - --host
            - "0.0.0.0"
            - --port
            - "5050"
          env:
            - name: MLFLOW_AUTH_CONFIG_PATH
              value: /dev/null
          ports:
            - containerPort: 5050
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
      volumes:
        - name: mlflow-data
          emptyDir: {}    # Use PVC in production
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: agent-invest
spec:
  selector:
    app: mlflow
  ports:
    - port: 5050
      targetPort: 5050
