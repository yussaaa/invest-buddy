[project]
name = "agent-invest-backend"
version = "0.1.0"
description = "Multi-Agent Stock Investment Analysis Platform — Backend"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",

    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",

    # LLM providers
    "openai>=1.50.0",
    "anthropic>=0.36.0",

    # Data & finance
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "ta>=0.11.0",    # pandas-ta alternative — same indicators, supports Python 3.11
    "numpy>=1.26.0",
    "sec-edgar-downloader>=5.0.2",

    # Vector store
    "qdrant-client>=1.11.0",

    # Embeddings
    "sentence-transformers>=3.1.0",

    # RAG / search
    "tavily-python>=0.5.0",
    "newsapi-python>=0.2.7",
    "rank-bm25>=0.2.2",

    # DB
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",

    # Cache
    "redis[hiredis]>=5.1.0",

    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",

    # Evaluation
    "ragas>=0.2.0",
    "mlflow>=2.17.0",
    "wandb>=0.18.0",

    # Observability
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",

    # MCP server
    "mcp>=1.0.0",

    # HTTP
    "httpx>=0.27.0",
    "tenacity>=9.0.0",

    # Utils
    "uuid7>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
